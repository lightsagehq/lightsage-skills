interface:
  display_name: "Fix Failed Evals"
  short_description: "Diagnose failed Lightsage evals and propose the smallest fix"
  default_prompt: "Use $fix-failed-evals to diagnose my latest failed eval and propose the smallest useful fix."

dependencies:
  tools:
    - type: "mcp"
      value: "lightsage"
      description: "Lightsage eval-run, result and trace tools"
      transport: "streamable_http"
      url: "https://mcp.lightsage.com/mcp"

policy:
  allow_implicit_invocation: true
